id: short-90s
duration:
  min_seconds: 15
  max_seconds: 90
planning:
  primary_unit: beat
  allowed_hierarchy: [project, sequence, scene, beat, shot]
  progressive_lock: light
story:
  recommended_sequences: [1, 2]
  recommended_beats: [3, 8]
