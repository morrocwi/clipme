name: clipme-ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt

      - name: Python syntax
        run: python -m py_compile clipme.py core/*.py api/*.py

      - name: Unit tests
        run: python -m unittest discover -v tests

      - name: Short bootstrap
        run: |
          python clipme.py init /tmp/clipme-short --profile short-90s --title "CI Short" --duration 60
          python clipme.py validate /tmp/clipme-short
          python clipme.py plan /tmp/clipme-short
          python clipme.py next /tmp/clipme-short

      - name: Explainer bootstrap
        run: |
          python clipme.py init /tmp/clipme-explainer --profile explainer --title "CI Explainer" --duration 180
          python clipme.py validate /tmp/clipme-explainer
          python clipme.py plan /tmp/clipme-explainer

      - name: Longform bootstrap
        run: |
          python clipme.py init /tmp/clipme-long --profile longform --title "CI Long" --duration 1800
          python clipme.py validate /tmp/clipme-long
          python clipme.py plan /tmp/clipme-long

      - name: Film bootstrap
        run: |
          python clipme.py init /tmp/clipme-film --profile film --title "CI Film" --duration 7200
          python clipme.py validate /tmp/clipme-film
          python clipme.py plan /tmp/clipme-film
